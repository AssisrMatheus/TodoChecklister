# Releases the addon when "## Version" in TodoChecklister.toc changes on master.
#
# Bump the version in the toc, commit, push. This workflow then:
#   1. creates the git tag for that version (you never tag by hand)
#   2. builds one package per flavor with the BigWigs packager, named the way Wago's GitHub release
#      automation expects (https://addons.wago.io: .zip = Retail, -mists, -bcc, -classic = Classic Era, -forever)
#   3. uploads them to CurseForge and one GitHub Release (plus a release.json listing each file's flavor)
#   4. Wago is not uploaded to here: its release automation imports the files from the GitHub Release
#   5. uploads two combined zips to WoWInterface, which has one page (one current file) per client family:
#      25349 gets Retail + Forever (both run the mainline client), 25348 gets Mists + TBC + Classic Era
#
# Pushes that leave the version unchanged (or reuse an already released version) do nothing.
#
# A site is uploaded to only when its ID and its token are both set: CurseForge ## X-Curse-Project-ID in the
# toc + CF_API_TOKEN, WoWInterface "-w <id>" per step + WOWI_API_TOKEN. GitHub uses GITHUB_TOKEN.
# Each step only gets the tokens of the sites it should upload to.

name: Release

on:
  push:
    branches: [master]
    paths: [TodoChecklister.toc]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGER_VERSION: v2.7.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: needed for the tag check and the changelog

      - name: Read version from toc
        id: version
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' TodoChecklister.toc | tr -d '\r[:space:]')
          if [[ ! $version =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error file=TodoChecklister.toc::## Version \"$version\" is not x.y or x.y.z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Version $version is already released, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag version
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Version $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Set up packager
        id: packager
        if: steps.version.outputs.new == 'true'
        run: |
          # pkgmeta externals are svn repos (repos.wowace.com); ubuntu-latest has no svn
          sudo apt-get install -yq subversion >/dev/null
          curl -fsSL "https://raw.githubusercontent.com/BigWigsMods/packager/$PACKAGER_VERSION/release.sh" -o "$RUNNER_TEMP/release.sh"
          # Stock release.sh replaces spaces in upload labels with "_" ("1.2.4_-_Retail").
          # Run the label through the filter with skip_invalid, like its own "-n" validation does.
          sed -i 's/archive_label="\$( filename_filter "\$label_template" )"/archive_label="$( skip_invalid=true filename_filter "$label_template" )"/' "$RUNNER_TEMP/release.sh"
          grep -q 'archive_label="$( skip_invalid=true filename_filter' "$RUNNER_TEMP/release.sh" \
            || { echo "::error::Label patch did not apply to packager $PACKAGER_VERSION"; exit 1; }

      # release.sh refuses to package a branch push whose HEAD carries a tag ("Found future tag"),
      # expecting a separate tag-triggered run. Tags pushed with GITHUB_TOKEN start no workflows,
      # so the build runs here, with GITHUB_EVENT_NAME overridden for release.sh only.
      #
      # Package steps run even when an earlier one failed, so one site's error doesn't skip the other flavors.
      - name: Package and upload Retail
        if: ${{ !cancelled() && steps.packager.outcome == 'success' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -g retail -w 0 \
            -n "{package-name}-{project-version}:{project-version} - Retail"

      - name: Package and upload Mists Classic
        if: ${{ !cancelled() && steps.packager.outcome == 'success' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -g mists -w 0 \
            -n "{package-name}-{project-version}-mists:{project-version} - Mists"

      # TBC Classic Anniversary is the packager's "bcc" game type (interface 20xxx)
      - name: Package and upload TBC Anniversary
        if: ${{ !cancelled() && steps.packager.outcome == 'success' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -g bcc -w 0 \
            -n "{package-name}-{project-version}-bcc:{project-version} - TBC"

      # Classic Era is the packager's "classic" game type (interface 11xxx)
      - name: Package and upload Classic Era
        if: ${{ !cancelled() && steps.packager.outcome == 'success' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -g classic -w 0 \
            -n "{package-name}-{project-version}-classic:{project-version} - Classic Era"

      - name: Package and upload Forever
        if: ${{ !cancelled() && steps.packager.outcome == 'success' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -g forever -w 0 \
            -n "{package-name}-{project-version}-forever:{project-version} - Forever"

      # WoWInterface only (no CurseForge or GitHub token). "-g" takes game versions (x.y.z) as a list,
      # so the toc interfaces are converted (120105 -> 12.1.5) and the zip's toc keeps all of them.
      # Retail is 6 digits, Forever 16xxx
      - name: Upload Retail + Forever to WoWInterface
        if: ${{ !cancelled() && steps.packager.outcome == 'success' }}
        env:
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
        run: |
          versions=$(sed -n 's/^## Interface:[[:space:]]*//p' TodoChecklister.toc | tr -d '\r ' | tr ',' '\n' \
            | awk '/^([0-9][0-9][0-9][0-9][0-9][0-9]|16[0-9][0-9][0-9])$/ { printf "%s%d.%d.%d", sep, $1 / 10000, ($1 / 100) % 100, $1 % 100; sep = "," }')
          if [[ -z $versions ]]; then
            echo "::error file=TodoChecklister.toc::## Interface has no retail (6 digits) or Forever (16xxx) version"
            exit 1
          fi
          echo "Retail + Forever game versions: $versions"
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -g "$versions" -w 25349 \
            -n "{package-name}-{project-version}:{project-version} - Retail"

      # Mists 50xxx, TBC Anniversary 20xxx, Classic Era 11xxx
      - name: Upload Mists + TBC + Classic Era to WoWInterface
        if: ${{ !cancelled() && steps.packager.outcome == 'success' }}
        env:
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
        run: |
          versions=$(sed -n 's/^## Interface:[[:space:]]*//p' TodoChecklister.toc | tr -d '\r ' | tr ',' '\n' \
            | awk '/^([52][0-9][0-9][0-9][0-9]|11[0-9][0-9][0-9])$/ { printf "%s%d.%d.%d", sep, $1 / 10000, ($1 / 100) % 100, $1 % 100; sep = "," }')
          if [[ -z $versions ]]; then
            echo "::error file=TodoChecklister.toc::## Interface has no Mists (50xxx), TBC (20xxx) or Classic Era (11xxx) version"
            exit 1
          fi
          echo "Classic game versions: $versions"
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -g "$versions" -w 25348 \
            -n "{package-name}-{project-version}-classic:{project-version} - Classic"
